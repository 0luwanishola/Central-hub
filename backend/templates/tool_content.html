<div class="p-4 md:p-6 max-w-4xl mx-auto">
    <!-- Tool header -->
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <a href="/" class="p-2 rounded-lg text-surface-500 hover:text-surface-700 dark:hover:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors" hx-get="/" hx-target="#main-content" hx-push-url="true">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </a>
            <div>
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-2xl bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center text-3xl">{{ tool.icon }}</div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-surface-900 dark:text-white">{{ tool.name }}</h1>
                        <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-surface-100 dark:bg-surface-800 text-surface-600 dark:text-surface-400 capitalize">{{ tool.category }}</span>
                    </div>
                </div>
                <p class="text-surface-500 dark:text-surface-400 mt-1">{{ tool.description }}</p>
            </div>
        </div>
    </div>

    <!-- Tool content area -->
    <div id="tool-content" class="bg-white dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-800 p-6">
        <div class="text-center py-8 text-surface-500 dark:text-surface-400">
            <svg class="w-12 h-12 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            <p class="text-lg">{{ tool.name }} implementation coming soon...</p>
            <p class="text-sm mt-2">This is a placeholder. Add your tool logic here.</p>
        </div>
    </div>
</div>
